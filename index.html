<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Menu - Full Stack POC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    .disclaimer {
      margin-top: 30px;
      padding: 10px;
      background-color: #fff8dc;
      border-left: 4px solid #e0a800;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Available Food Items</h1>
  <p>Proof-of-Concept Full Stack Application</p>

  <!-- Table to display fetched food items -->
  <table id="food-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Food Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody id="food-table-body">
      <!-- Rows will be dynamically inserted here -->
    </tbody>
  </table>

  <!-- Required student work disclaimer -->
  <footer class="disclaimer">
    <strong>Disclaimer:</strong> This application is created ONLY for demonstrating a student’s web development skills.
  </footer>

  <script>
    /**
     * Fetches food items from the backend GET /foods endpoint
     * and dynamically populates the HTML table body.
     */
    async function loadFoods() {
      try {
        const response = await fetch("/foods");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const foods = await response.json();
        const tableBody = document.getElementById("food-table-body");
        tableBody.innerHTML = "";

        foods.forEach((food) => {
          const row = document.createElement("tr");

          const idCell = document.createElement("td");
          idCell.textContent = food.id;

          const nameCell = document.createElement("td");
          nameCell.textContent = food.name;

          const priceCell = document.createElement("td");
          priceCell.textContent = `$${food.price.toFixed(2)}`;

          row.appendChild(idCell);
          row.appendChild(nameCell);
          row.appendChild(priceCell);

          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("Error loading food items:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", loadFoods);
  </script>
</body>
</html>
